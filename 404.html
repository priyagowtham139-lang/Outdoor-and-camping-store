<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<script>
/* run before first paint: never let the browser restore or animate a previous
   scroll position on a fresh load — the new page should just open at the top */
try { if ('scrollRestoration' in history) history.scrollRestoration = 'manual'; } catch (e) {}
document.documentElement.classList.add('no-smooth');
function __clearSmooth(){ setTimeout(function(){ document.documentElement.classList.remove('no-smooth'); }, 120); }
window.addEventListener('load', __clearSmooth);
window.addEventListener('pageshow', __clearSmooth);
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>Page Not Found — Stackly</title>
<meta name="description" content="You have walked off the trail. Return to the last section you were reading on Stackly." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<link rel="stylesheet" href="css/style.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23000'/%3E%3Cpath d='M5 25 13 10l5 9M18 25l7-12 4 7' stroke='%23fff' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
</head>
<body data-page="404" id="back404">

<div class="loader" id="loader" role="status" aria-label="Loading Stackly">
  <div class="loader-inner">
    <div class="loader-mark">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle class="spin-ring" cx="50" cy="50" r="44" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="1.5" stroke-dasharray="26 12"/>
        <circle class="pin-dot" cx="50" cy="50" r="3" fill="#fff"/>
        <g class="pin-pop">
          <path d="M50 30 L62 52 L50 47 L38 52 Z" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"/>
          <path d="M22 68 H78" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M30 68 L40 52 M46 68 L52 57 M58 68 L64 56" stroke="rgba(255,255,255,.45)" stroke-width="1.6" stroke-linecap="round"/>
        </g>
      </svg>
    </div>
    <div class="loader-word"></div>
    <span class="loader-tag">Outdoor Equipment Co.</span>
    <div class="loader-bar"><i></i></div>
    <span class="loader-pct">LOADING <b>00</b> / 100</span>
    <p class="loader-tips" style="transition:opacity .26s"></p>
  </div>
</div>

<main class="nf" role="alert" aria-labelledby="nf-h">

  <div class="nf-grid" aria-hidden="true"></div>
  <div class="blob w" style="top:-16%;left:-12%;opacity:.1"></div>
  <div class="blob w" style="bottom:-20%;right:-14%;opacity:.07"></div>

  <!-- brand bar -->
  <a class="logo" href="index.html" style="position:absolute;top:clamp(1rem,3vw,1.8rem);left:clamp(1.2rem,4vw,2.6rem);z-index:5" aria-label="Stackly home">
    <img class="logo-img" src="assets/logo_c2410c.webp" alt="" width="367" height="98" />
  </a>

  <div class="marquee no-mask" style="position:absolute;top:0;left:0;right:0;--mq-dur:40s;z-index:4;pointer-events:none;opacity:.5" aria-hidden="true">
    <div class="marquee-track rev">
      <span class="mq-item mq-outline thin" style="font-size:clamp(1rem,2vw,1.5rem)">Off route</span><i class="mq-dot"></i>
      <span class="mq-item mq-outline thin" style="font-size:clamp(1rem,2vw,1.5rem)">No waypoint here</span><i class="mq-dot"></i>
      <span class="mq-item mq-outline thin" style="font-size:clamp(1rem,2vw,1.5rem)">Trail ends here</span><i class="mq-dot"></i>
    </div>
  </div>

  <div class="nf-in">
    <!-- animated compass / 404 mark -->
    <div class="nf-code" aria-hidden="true">
      <svg viewBox="0 0 400 400">
        <defs>
          <linearGradient id="nfArc" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#fff" stop-opacity="1"/>
            <stop offset="100%" stop-color="#fff" stop-opacity=".25"/>
          </linearGradient>
        </defs>
        <g class="orbit" style="transform-origin:200px 200px">
          <circle cx="200" cy="200" r="184" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="1"/>
          <circle cx="200" cy="200" r="184" fill="none" stroke="url(#nfArc)" stroke-width="2"
                  class="dash-arc" style="--len:1156" transform="rotate(-90 200 200)" stroke-dasharray="300 200"/>
        </g>
        <g class="orbit rev" style="transform-origin:200px 200px">
          <circle cx="200" cy="200" r="150" fill="none" stroke="rgba(255,255,255,.09)" stroke-width="1" stroke-dasharray="3 9"/>
          <g stroke="rgba(255,255,255,.22)" stroke-width="1.5" stroke-linecap="round">
            <path d="M200 32 v16"/><path d="M200 352 v16"/>
            <path d="M32 200 h16"/><path d="M352 200 h16"/>
          </g>
          <g fill="rgba(255,255,255,.5)">
            <circle cx="200" cy="16" r="3"/><circle cx="200" cy="384" r="3"/>
            <circle cx="16" cy="200" r="3"/><circle cx="384" cy="200" r="3"/>
          </g>
        </g>
        <g class="orbit" style="transform-origin:200px 200px;animation-duration:12s">
          <path d="M200 84 L226 200 L200 184 L174 200 Z" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round" opacity=".85"/>
          <path d="M200 316 L226 200 L200 216 L174 200 Z" fill="rgba(255,255,255,.18)" stroke="rgba(255,255,255,.4)" stroke-width="1.4" stroke-linejoin="round"/>
        </g>
      </svg>
      <span class="num-g">404</span>
      <span class="nf-pin" style="top:8%;left:50%"></span>
      <span class="nf-pin" style="bottom:14%;left:22%;animation-delay:.7s"></span>
      <span class="nf-pin" style="bottom:10%;right:20%;animation-delay:1.4s"></span>
    </div>

    <span class="eyebrow">Error 404 &middot; Waypoint Lost</span>
    <h1 class="d2" id="nf-h" style="max-width:22ch" data-split>You have walked<br />off the <span class="hl">marked trail.</span></h1>
    
    <div class="nf-acts">
      <button class="btn solid lg" type="button" id="goBack" data-magnetic>
        <span id="goBackLabel">GOBACK</span>
      </button>
      <a class="btn lg" href="index.html"><i class="fa-solid fa-house"></i> HOME</a>
    </div>

    <p class="nf-hint" id="nfHint">Checking your last position</p>

    
  </div>

  
</main>

<div class="toast-wrap" id="toastWrap" aria-live="polite"></div>

<script src="js/layout.js"></script>
<script src="js/main.js"></script>
</body>
</html>
